version: "3.8"

services:
  # ── Python FastAPI backend ─────────────────────────────────────────────────
  api:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: sqlite+aiosqlite:////app/dev.db
      ANALYSIS_SERVICE_URL: http://analysis:8000
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      - db_data:/app
    depends_on:
      - analysis

  # ── Analysis microservice (ML / heavy deps) ────────────────────────────────
  analysis:
    build: ./services/analysis-service
    ports:
      - "8000:8000"

  # ── Next.js frontend ───────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
    depends_on:
      - api

volumes:
  db_data:
